name: SailfishOS build

on:
  push:
    branches:
      - master
    tags:
      - '*'
  pull_request:
    branches:
      - master

env:
  RELEASE: 4.6.0.13
  TAILSCALE_VERSION: 1.104.5

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - arch: armv7hl
            tailscale_arch: arm
          - arch: aarch64
            tailscale_arch: arm64
          - arch: i486
            tailscale_arch: 386

    steps:
    - uses: actions/checkout@v6

    - name: prepare
      run: mkdir RPMS

    - name: Build ${{ matrix.arch }}
      run: docker run --rm --privileged -v $PWD:/workspace coderus/sailfishos-platform-sdk:$RELEASE /bin/bash -c "
            mkdir -p build ;
            cd build ;
            cp -r /workspace/* . ;
            cd rpm ;
            curl -O https://pkgs.tailscale.com/stable/tailscale_${TAILSCALE_VERSION}_${{ matrix.tailscale_arch }}.tgz ;
            cd .. ;
            mb2 -t SailfishOS-$RELEASE-${{ matrix.arch }} build --prepare ;
            sudo cp -r RPMS/*.rpm /workspace/RPMS"

    - name: Upload build result
      uses: actions/upload-artifact@v5
      with:
        name: rpms-${{ matrix.arch }}
        path: RPMS

  publish:
      name: Publish the release
      needs: build
      if: github.ref_type == 'tag'
      runs-on: ubuntu-latest
      permissions:
        contents: write      # create the release
        id-token: write      # sign the build attestation
        attestations: write  # store it, so Harpoon can verify its own updates
      steps:
        - uses: actions/checkout@v6

        - uses: actions/download-artifact@v8
          with:
            path: RPMS
            merge-multiple: true

        - name: Checksums
          run: |
            cd RPMS
            sha256sum *.rpm > SHA256SUMS
            cat SHA256SUMS

        - uses: actions/attest-build-provenance@v2
          with:
            subject-path: RPMS/*.rpm

        - name: Release notes
          run: |
            awk 'NR > 1 && /^\*/ { exit } NR > 1' rpm/harbour-tailscale.changes > notes.md
            cat notes.md

        - name: Create the release
          env:
            GH_TOKEN: ${{ github.token }}
          run: |
            prerelease=
            case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; esac
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              # A re-run replaces the release's files.
              gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' |
                while read -r asset; do gh release delete-asset "$GITHUB_REF_NAME" "$asset" -y; done
              gh release upload "$GITHUB_REF_NAME" RPMS/*.rpm RPMS/SHA256SUMS
              gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            else
              gh release create "$GITHUB_REF_NAME" RPMS/*.rpm RPMS/SHA256SUMS \
                --title "harbour-Tailscale $GITHUB_REF_NAME" --notes-file notes.md --verify-tag $prerelease
            fi
